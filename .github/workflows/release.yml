name: Release Obsidian plugin

on:
    push:
        tags:
            - "*"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: npm

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Verify tag matches manifest
              shell: bash
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  version="$(node -p "require('./manifest.json').version")"
                  if [[ "$tag" != "$version" ]]; then
                    echo "Tag $tag does not match manifest version $version."
                    exit 1
                  fi

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: main.js

            - name: Create draft release if needed
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF#refs/tags/}"
                  if ! gh release view "$tag" >/dev/null 2>&1; then
                    gh release create "$tag" \
                      --title="MdAssetSync $tag" \
                      --draft \
                      --generate-notes
                  fi

            - name: Upload release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release upload "$tag" main.js manifest.json --clobber

            - name: Verify release assets
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF#refs/tags/}"
                  asset_names="$(gh release view "$tag" --json assets --jq '.assets[].name')"
                  for asset in main.js manifest.json; do
                    if ! grep -Fxq "$asset" <<<"$asset_names"; then
                      echo "Release $tag is missing required asset: $asset"
                      exit 1
                    fi
                  done

            - name: Publish verified release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  tag="${GITHUB_REF#refs/tags/}"
                  gh release edit "$tag" --draft=false --latest
